name: Daily Scraper & Prediction Job

on:
  schedule:
    - cron: '0 0 * * *'  # Exécution automatique chaque nuit à 00:00 UTC
  workflow_dispatch:      # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  run_daily_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Job
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ia_betpredict/backend
        run: |
          python -m main