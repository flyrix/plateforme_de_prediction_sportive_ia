name: Daily Scraper & Prediction Job

on:
  schedule:
    - cron: '0 0 * * *'  # Exécution automatique chaque nuit à 00:00 UTC
  workflow_dispatch:      # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  run_daily_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ia_betpredict/backend/requirements.txt ]; then
            pip install -r ia_betpredict/backend/requirements.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Execute Daily Job
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PYTHONPATH=ia_betpredict/backend python -c "import asyncio, sys; sys.path.insert(0, 'ia_betpredict/backend'); from main import daily_prediction_job; asyncio.run(daily_prediction_job())"