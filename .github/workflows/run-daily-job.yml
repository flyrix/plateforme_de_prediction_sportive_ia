name: Trigger daily backend job

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger_daily_job:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render backend daily job endpoint
        run: |
          curl --fail -X POST https://plateforme-de-prediction-sportive-ia.onrender.com/run-daily-job \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Accept: application/json"
