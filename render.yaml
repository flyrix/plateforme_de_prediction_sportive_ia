services:
  - type: web
    name: plateforme_de_prediction_sportive_ia
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SCRAPINGANT_KEY
        sync: false
      - key: SCRAPINGANT_BROWSER
        value: "false"
      - key: SCRAPINGANT_PROXY_TYPE
        value: "datacenter"
      - key: SCRAPINGANT_PROXY_COUNTRY
        sync: false
      - key: SCRAPINGANT_TIMEOUT
        value: "25"
    autoDeploy: true
